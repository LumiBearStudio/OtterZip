[workspace]
resolver = "2"
members = [
    "crates/otterzip-core",
    "crates/otterzip-ffi",
    "crates/otterzip-bench",
    "crates/otterzip-cli",
]

[workspace.package]
version = "1.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["OtterZip Contributors"]
repository = "https://github.com/otterzip/otterzip"
rust-version = "1.80"

[workspace.dependencies]
# --- error / logging ---
thiserror = "2"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"
zeroize   = { version = "1", features = ["derive"] }

# --- parallel / IO ---
rayon     = "1"
memmap2   = "0.9"

# --- compression backends ---
libdeflater = "1"
zstd        = "0.13"
bzip2       = "0.5"
xz2         = "0.1"
flate2      = { version = "1", default-features = false, features = ["zlib-ng"] }
tar         = "0.4"
# PR-F7 ZIPX writer needs the bzip2/lzma compression methods on the
# write side (zip-rs feature-gates each codec). The read side picks
# them up automatically; tests verify Bandizip / 7-Zip can decompress
# the result.
zip         = { version = "2", default-features = false, features = ["deflate-zlib-ng", "bzip2", "lzma", "aes-crypto"] }
sevenz-rust2 = "0.21"
num_cpus    = "1"
unrar       = "0.5"
# Phase 7+ option Y (PR-F2): LZ4 frame format. Pure-Rust crate, MIT.
lz4_flex    = { version = "0.13", default-features = false, features = ["frame", "std"] }
# Phase 7+ option Y (PR-F5): ISO9660 reader with Joliet + Rock Ridge.
# cdfs (the plan's original choice) doesn't build on Windows because of
# its hard `fuser` dep; iso9660-rs is `no_std` + cross-platform and has
# explicit Joliet support, which the plan's PoC gate flagged as a risk
# for cdfs. See docs/05-build/phase-7-plus-plan.md §7 for the swap log.
iso9660-rs  = { version = "1", default-features = false, features = ["all-extensions"] }
gpt_disk_io = "0.16"
# Phase 7+ option Y (PR-F6): Microsoft Cabinet + Compound File Binary
# (MSI is an OLE2/CFB container that often embeds CABs). Both pure-Rust
# crates, MIT, no system deps.
cab         = "0.6"
cfb         = "0.10"

# --- lenient fallback ---
# The libarchive (compress-tools) fallback shipped through commit
# 9777acd and was replaced by an in-tree EOCD/CD parser at the v1.0
# sprint. The crate dependency, the vcpkg requirement, and the
# `libarchive-fallback` Cargo feature are gone; the lenient ZIP path
# lives in `crates/otterzip-core/src/backends/lenient_zip.rs`. See
# `docs/05-build/lenient-zip-parser-plan.md` for the migration record.

# --- Korean filename handling ---
# chardetng = Firefox's fallback encoding detector (CJK-aware). Used in
# the legacy-codepage cascade after the EFS bit / 0x7075 paths fail.
# encoding_rs = WHATWG Encoding Standard, EUC_KR static maps to CP949
# (UHC) which covers every Bandizip-era Korean ZIP filename.
chardetng    = "0.1"
encoding_rs  = "0.8"
sys-locale   = "0.3"

# --- CRC ---
# crc32fast — SIMD-accelerated CRC-32 (SSE4.2/NEON), used by the
# self-contained ZIP writer to populate LFH/CDFH per-entry CRC.
crc32fast    = "1"

# --- CLI (otterzip-cli binary only; anyhow allowed in binaries per
#     CONVENTIONS §1.3 — the library-side thiserror rule does not apply) ---
clap     = { version = "4", features = ["derive", "wrap_help"] }
anyhow   = "1"
tempfile = "3"

# --- dev ---
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# "unwind" (not "abort") so the FFI's per-call `catch_unwind` actually
# works: a Rust panic unwinds, is caught at the C ABI boundary, mapped to
# ErrorCode::Generic (-1) + "panic in FFI: …", and surfaced to C# as a
# recoverable OtterzipException instead of hard-aborting the process. That
# turns our own bugs into reportable Sentry events (category=bug) and keeps
# the app alive (the operation fails, the window survives). Panics never
# cross the extern "C" boundary, so unwinding stays sound.
panic = "unwind"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true   # ?꾨줈?뚯씪留곸슜 ?щ낵 ?좎?

[profile.dev]
opt-level = 0
debug = true

# Hot-path crates compile with -O2 even in dev profile. Rust's
# `cargo build` (no --release) is what the WinUI 3 .NET Debug
# configuration picks up via OtterZip.Interop.csproj's <_RustProfile>
# branch — leaving these at -O0 made many-files ZIP extracts
# pathologically slow because the per-entry wrapper code (path
# resolution, dir creation, BufReader copies) ran 20-100× slower
# than the C zlib-ng decoder it surrounded, so 8 rayon workers
# couldn't saturate the NVMe even though the parallel path was
# firing. Diagnostic that triggered this: 7 GB / many-files archive,
# CPU 15 %, disk D: read 37 MB/s, write 0, Bandizip 30 s, OtterZip
# hung. Compile times stay reasonable because only the workspace's
# own crates + their direct dependencies get optimised — the
# compiler / proc-macro deps stay at -O0.
[profile.dev.package.otterzip-core]
opt-level = 2
[profile.dev.package.otterzip-ffi]
opt-level = 2
[profile.dev.package."zip"]
opt-level = 2
[profile.dev.package."flate2"]
opt-level = 2
[profile.dev.package."libz-ng-sys"]
opt-level = 3
[profile.dev.package."miniz_oxide"]
opt-level = 3
[profile.dev.package."rayon"]
opt-level = 2
[profile.dev.package."rayon-core"]
opt-level = 2
